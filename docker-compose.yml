# VentureWise — shared infrastructure.
#
# Every compose file in this repo uses the project name `venturewise` and the
# `venturewise` network, so nothing collides with other projects on this machine.
#
#   docker compose up -d          # start infra
#   docker compose down           # stop  infra (volumes are kept)
#   docker compose down -v        # stop  infra and wipe the data

name: venturewise

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-venturewise}
    ports:
      # Host port only — other services reach it in-network as `mongo:27017`.
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - venturewise

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - venturewise

volumes:
  mongo-data:
  redis-data:

networks:
  venturewise:
    name: venturewise
    driver: bridge
