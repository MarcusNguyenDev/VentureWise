# Build both images, push them to GHCR as :latest, then tell the server to pull.
#
# Repository secrets:
#   FE_ENV            front-end/.env contents — needed at *build* time so
#                     NEXT_PUBLIC_* is inlined into the bundle.
#   HOST_DOMAIN       ssh host
#   HOST_USER         ssh user (owns ~/venturewise, runs rootless podman)
#   HOST_PRIVATE_KEY  private key for that user, OpenSSH format
#
# Everything else lives on the server and is maintained by hand:
# docker-compose.prod.yml, .env, api.env, web.env. This workflow never
# writes them.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/marcusnguyendev/venturewise-api:latest
  WEB_IMAGE: ghcr.io/marcusnguyendev/venturewise-front-end:latest

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write the front-end build env
        run: printf '%s\n' "${{ secrets.FE_ENV }}" > front-end/.env

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: production
          push: true
          provenance: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Front-end image
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          target: production
          push: true
          provenance: false
          tags: ${{ env.WEB_IMAGE }}
          secret-files: |
            fe_env=front-end/.env
          cache-from: type=gha,scope=front-end
          cache-to: type=gha,scope=front-end,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: podman compose up
        env:
          HOST_DOMAIN: ${{ secrets.HOST_DOMAIN }}
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_PRIVATE_KEY: ${{ secrets.HOST_PRIVATE_KEY }}
          API_ENV: ${{ secrets.API_ENV }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOST_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Derive the public half from the secret and print it. A public key
          # is not sensitive, and it answers the only two questions a
          # "Permission denied (publickey)" leaves open: whether the secret is
          # a usable key at all, and whether it is the key the server trusts.
          # This fails outright if the key is passphrase-protected or if the
          # PEM got mangled on the way into the secret.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub; then
            echo "::error::HOST_PRIVATE_KEY is not a usable unencrypted private key."
            echo "Either it has a passphrase (unusable in CI — generate a new"
            echo "passphrase-less key) or the PEM body/newlines were mangled."
            exit 1
          fi
          echo "CI is offering this public key:"
          cat ~/.ssh/deploy_key.pub
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          echo "It must appear verbatim in ~$HOST_USER/.ssh/authorized_keys on the host."

          # Push API_ENV to ~/venturewise/.env before bringing the stack up.
          #
          # Compose reads that one file twice: for the ${...} substitutions in
          # docker-compose.prod.yml (ports, mongo credentials) and as the api
          # container's env_file. A missing key there does not error — it
          # silently falls back to a default and takes the site down, which is
          # how the front-end ended up on :3000 instead of :3308. So the keys
          # the compose file depends on are checked here, before anything
          # overwrites a file that is currently working.
          # No secret set at all: leave the host's .env alone and carry on.
          # The server maintains that file by hand today, and failing the whole
          # deploy over an unset secret is worse than not updating it.
          if [ -z "${API_ENV//[[:space:]]/}" ]; then
            echo "::warning::API_ENV secret is unset — keeping the .env already on the host."
            SKIP_ENV_PUSH=1
          else
            SKIP_ENV_PUSH=0
            for required in MONGO_USER MONGO_PASSWORD WEB_PORT API_PORT; do
              if ! printf '%s\n' "$API_ENV" | grep -qE "^[[:space:]]*${required}="; then
                echo "::error::API_ENV is set but missing ${required} — refusing to overwrite the working .env on the host."
                exit 1
              fi
            done
          fi

          # Written to a temp file and moved into place, so an interrupted
          # transfer cannot leave a half-written .env behind. The previous one
          # is kept as .env.bak for a fast manual rollback.
          if [ "$SKIP_ENV_PUSH" = "0" ]; then
          printf '%s\n' "$API_ENV" | ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              "$HOST_USER@$HOST_DOMAIN" \
              'set -eu; mkdir -p ~/venturewise; cd ~/venturewise; \
               cat > .env.new; \
               [ -f .env ] && cp -f .env .env.bak; \
               mv .env.new .env; \
               chmod 600 .env; chmod 700 .; \
               echo "wrote $(wc -l < .env) lines to ~/venturewise/.env"'
          fi

          # BatchMode makes a bad key or an unreachable host fail immediately
          # instead of sitting on an interactive prompt until the job times out.
          # IdentitiesOnly stops ssh offering anything but this key.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              "$HOST_USER@$HOST_DOMAIN" \
              "echo '$REGISTRY_TOKEN' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin && \
               cd ~/venturewise && \
               podman compose -f docker-compose.prod.yml up -d --pull always --remove-orphans && \
               podman image prune -f"
