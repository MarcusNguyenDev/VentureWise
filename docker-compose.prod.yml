# VentureWise — production stack (runs on the server, under rootless podman).
#
# Lives at ~/venturewise/ alongside three files you maintain by hand. The
# deploy workflow never writes any of them; it only pushes new :latest images
# and runs `podman compose up -d --pull always` here.
#
#   .env      CLIENT_PORT, API_PORT, and MONGO_USER / MONGO_PASSWORD / MONGO_DB
#             (compose reads this file automatically for the substitutions below)
#   api.env   the api container's runtime env
#   web.env   the front-end's server-side env. NEXT_PUBLIC_* is inlined into
#             the bundle at build time, so those only change via a new image.
#
# Nothing listens on a public interface: both services publish to 127.0.0.1 and
# the host's nginx terminates TLS on 443 and proxies to them. Port 80 is the
# port *inside* the containers, not on the host.
#
# nginx routes by path on one domain:
#
#   location /api/ -> 127.0.0.1:${API_PORT}     every API route is under /api
#   location /     -> 127.0.0.1:${CLIENT_PORT}
#
# The API sets that prefix itself (`setGlobalPrefix('api')` in main.ts), so
# nginx passes the path through unchanged — no rewrite, and nothing outside
# /api is served by the API.

name: venturewise

services:
  mongo:
    image: docker.io/library/mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in ~/venturewise/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in ~/venturewise/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-venturewise}
    # Reachable in-network as `mongo:27017`; never published to the host.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - venturewise

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - venturewise

  api:
    image: ghcr.io/marcusnguyendev/venturewise-api:latest
    restart: unless-stopped
    # api.env carries the secrets and model config; the values below are
    # deployment facts that must win over whatever the secret happens to say.
    env_file:
      - ./api.env
    environment:
      NODE_ENV: production
      PORT: "80"
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-venturewise}?authSource=admin
      REDIS_URL: redis://redis:6379
    ports:
      # From .env beside this file.
      - "127.0.0.1:${API_PORT:-3001}:80"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - venturewise

  front-end:
    image: ghcr.io/marcusnguyendev/venturewise-front-end:latest
    restart: unless-stopped
    env_file:
      - ./web.env
    environment:
      NODE_ENV: production
      PORT: "80"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # From .env beside this file.
      - "127.0.0.1:${CLIENT_PORT:-3000}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - venturewise

volumes:
  mongo-data:
  redis-data:

networks:
  venturewise:
    name: venturewise-prod
    driver: bridge
