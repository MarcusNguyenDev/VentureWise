# VentureWise API — development stack.
#
# Shares the project name `venturewise` with every other compose file in the
# repo, so all containers group together on the default network. Start the
# infrastructure first:
#
#   docker compose -f ../docker-compose.yml up -d
#   docker compose up -d           # start the API
#   docker compose logs -f api     # follow the logs
#   docker compose down            # stop it
#
# A `.prod` counterpart can reuse this file's shape with `target: production`.

name: venturewise

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: venturewise/api:dev
    restart: unless-stopped
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run start:dev"
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      MONGODB_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/${MONGO_DB:-venturewise}?authSource=admin
    ports:
      - "${API_PORT:-3001}:3001"
      - "${API_DEBUG_PORT:-9229}:9229"
    volumes:
      # The whole repo, so `.git` (and the sibling module) is visible from the
      # container. Work happens in /workspaces/api — see the Dockerfile WORKDIR.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies out of the host bind mount.
      - api_node_modules:/workspaces/api/node_modules

volumes:
  api_node_modules:
