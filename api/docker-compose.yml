# VentureWise API — development stack.
#
# Start the shared infrastructure first (it owns the network):
#
#   docker compose -f ../docker-compose.yml up -d
#   docker compose up -d           # start the API
#   docker compose logs -f api     # follow the logs
#   docker compose down            # stop it

name: venturewise

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: venturewise/api:dev
    restart: unless-stopped
    # The whole repo is mounted, so work happens in the api subdirectory.
    working_dir: /workspaces/api
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run dev"
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      MONGODB_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/${MONGO_DB:-venturewise}?authSource=admin
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
      - "${API_DEBUG_PORT:-9229}:9229"
    volumes:
      # The repo root, so `.git` is reachable from inside the container.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies out of the host bind mount.
      - api-node-modules:/workspaces/api/node_modules
    networks:
      - venturewise

volumes:
  api-node-modules:

networks:
  venturewise:
    external: true
    name: venturewise
