# VentureWise front-end — development stack.
#
# Start the shared infrastructure first (it owns the network):
#
#   docker compose -f ../docker-compose.yml up -d
#   docker compose up -d                 # start the dev server
#   docker compose logs -f front-end     # follow the logs
#   docker compose down                  # stop it

name: venturewise

services:
  front-end:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: venturewise/front-end:dev
    restart: unless-stopped
    # The whole repo is mounted, so work happens in the front-end subdirectory.
    working_dir: /workspaces/front-end
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run dev"
    environment:
      # NODE_ENV is deliberately NOT set.
      #
      # Next sets it per command — development for `next dev`, production for
      # `next build` and `next start`. Forcing it to development here leaked
      # into `next build` run inside this container and broke the production
      # build: React ships separate development and production builds, the
      # bundler picks between them on NODE_ENV, and the mismatch surfaced as
      # "Cannot read properties of null (reading 'useContext')" while
      # prerendering. Next warns about the non-standard value; the warning is
      # worth believing.
      NEXT_TELEMETRY_DISABLED: "1"
      # File watching over a bind mount needs polling on macOS/Windows.
      WATCHPACK_POLLING: "true"
      # Browser-facing, so localhost rather than the in-network `api:3001` —
      # the request is made by the visitor's machine, not by this container.
      API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # The repo root, so `.git` is reachable from inside the container.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies and build cache out of the bind mount.
      - front-end-node-modules:/workspaces/front-end/node_modules
      - front-end-next:/workspaces/front-end/.next
    networks:
      - venturewise

volumes:
  front-end-node-modules:
  front-end-next:

networks:
  venturewise:
    external: true
    name: venturewise
