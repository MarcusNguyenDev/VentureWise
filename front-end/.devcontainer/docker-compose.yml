# Dev container overlay on top of ../docker-compose.yml.
#
# Its own project name keeps `docker compose up` (the plain dev stack) and the
# dev container from recreating each other's containers. Ports are dropped here
# because VS Code forwards them itself.

name: venturewise-front-end-devcontainer

services:
  front-end:
    # VS Code attaches and runs the dev server from an integrated terminal.
    command: sleep infinity
    ports: !reset []
    volumes:
      # Lets the Docker / MongoDB extensions talk to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
